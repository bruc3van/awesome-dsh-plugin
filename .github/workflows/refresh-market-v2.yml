name: Refresh the v2 market feed

# Generate the current feed and its preview directly from reviewed sources.
# Snapshot and mapping workflows chain here explicitly because bot pushes do
# not trigger ordinary push workflows. No legacy feed or refresh lane remains.

on:
  workflow_run:
    workflows:
      - 'Refresh snapshot and review queue'
      - 'Expand subscription mappings toward 1000'
    types:
      - completed
  push:
    branches:
      - main
    paths:
      - 'data/approved.json'
      - 'data/curated.json'
      - 'scripts/market-pool.mjs'
      - 'scripts/categories.mjs'
      - 'scripts/markdown.mjs'
      - 'scripts/readme-install.mjs'
      - 'scripts/validate-market-entries.mjs'
      - 'data/packages.json'
      - 'data/featured.json'
      - 'scripts/market-v2.mjs'
      - 'scripts/validate-market-v2.mjs'
      - 'scripts/validate-packages.mjs'
      - '.github/workflows/refresh-market-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-refresh-market-v2
  cancel-in-progress: false

jobs:
  market-v2:
    # workflow_run fires on every completion of the upstream workflows,
    # failed ones included — only rebuild on top of source data they successfully
    # committed.
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Validate the packages mapping
        run: node scripts/validate-packages.mjs
      - name: Rebuild data/market-v2.json
        run: node scripts/market-v2.mjs
      - name: Validate data/market-v2.json
        run: node scripts/validate-market-v2.mjs
      - name: Run the market pipeline tests
        run: node --test scripts/test-market.mjs scripts/test-market-v2.mjs
      - name: Commit the refreshed v2 feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          stage() {
            git add data/market-v2.json MARKET.md
            if git diff --cached --quiet; then
              # The expected outcome whenever the trigger did not move the
              # payload: a packages.json edit for a repo outside the published
              # feed, an upstream run that kept the feed bit-for-bit, or a re-run of
              # this workflow after the real change already landed. Same reviewed
              # sources + same mapping = same file, generated_at included.
              echo "market-v2.json is already current — this change does not affect the published v2 feed."
              exit 0
            fi
            git commit -m "data: rebuild market-v2.json and preview from reviewed sources"
          }
          stage
          # A rejected push means main moved — possibly one of the feed's
          # sources (snapshot / curation / packages.json). Rebuild and re-validate on
          # the new tip instead of rebasing, so a stale join can never land.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then break; fi
            echo "Push rejected (attempt $attempt) — regenerating on top of origin/main."
            git fetch --depth=1 origin main
            git reset --hard FETCH_HEAD
            node scripts/validate-packages.mjs
            node scripts/market-v2.mjs
            node scripts/validate-market-v2.mjs
            stage
          done
          echo "Push still rejected after 3 attempts."
          exit 1
