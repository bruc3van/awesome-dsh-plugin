name: Refresh the downstream market file

# Spec §6: a curation change must reach the downstream market immediately
# after it merges — otherwise a blacklist fix would wait for the next daily
# cron. The market is review-gated, so approved.json moves it just like
# curated.json does: a review merge that approves or un-approves repositories
# changes what the feed may contain. This workflow rebuilds data/market.json
# from the stored snapshot on every push to main that touches either file and
# commits it. The daily update-catalog.yml covers the snapshot-refresh path;
# validate-curated.yml covers the same generation + validation inside PRs.
#
# The commit here only touches data/market.json and MARKET.md (its preview
# page), so it does not re-trigger this workflow.

on:
  push:
    branches:
      - main
    paths:
      - 'data/curated.json'
      - 'data/approved.json'
  workflow_dispatch:

permissions:
  contents: write

# Per-workflow group — see the note in update-catalog.yml. Both workflows
# write data/market.json; the commit step below makes that safe by
# regenerating on top of whatever landed first.
concurrency:
  group: data-refresh-market
  cancel-in-progress: false

jobs:
  market:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Rebuild data/market.json from the stored snapshot
        run: node scripts/market.mjs --from-snapshot
      - name: Validate data/market.json
        run: node scripts/validate-market.mjs
      - name: Run the market pipeline tests
        run: node --test scripts/test-market.mjs
      - name: Commit the refreshed market file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          stage() {
            git add data/market.json MARKET.md
            if git diff --cached --quiet; then
              # The expected outcome whenever a curation change does not reach
              # the published feed: an exclusion for a repository the market
              # already filtered out, a reworded reason. Same snapshot + same
              # projection = same payload, and market.mjs then keeps the
              # previous file bit for bit (its generated_at included).
              echo "market.json is already current — this change does not affect the published feed."
              exit 0
            fi
            git commit -m "data: rebuild market.json and its MARKET.md preview after curation change"
          }
          stage
          # A rejected push means main moved (a maintainer push, or the daily
          # crawl committing a new snapshot). Rebuild on the new tip instead
          # of rebasing generated files — the result then reflects both.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt) — regenerating on top of origin/main."
            git fetch --depth=1 origin main
            git reset --hard FETCH_HEAD
            node scripts/market.mjs --from-snapshot
            node scripts/validate-market.mjs
            stage
          done
          echo "Push still rejected after 3 attempts."
          exit 1
