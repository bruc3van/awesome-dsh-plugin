name: Publish the feed to npm (mirrored by npmmirror)

# China-reachable distribution: registry.npmmirror.com mirrors
# registry.npmjs.org, and raw.githubusercontent.com is unreliable from inside
# the GFW — so the market feeds (v1, v2, packages mapping) ship as the
# awesome-dsh-plugin-feed npm package. Consumers fetch
# https://registry.npmmirror.com/awesome-dsh-plugin-feed/latest/files/data/market-v2.json
#
# Runs only after the v2 join has completed successfully and
# can be triggered manually. The publish script's feedDigest gate makes this
# idempotent: same data = no-op without burning a version. Publishing uses
# npm Trusted Publishing (OIDC). After the first authenticated local release,
# configure this repository and publish-npm-feed.yml as the package's trusted
# publisher on npmjs.org, allowing direct npm publish.

on:
  workflow_run:
    workflows:
      - 'Refresh the v2 market feed'
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-feed-publish
  cancel-in-progress: false

jobs:
  publish:
    permissions:
      contents: read
      id-token: write
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      - name: Install npm with Trusted Publishing support
        run: npm install --global npm@11.15.0
      - name: Run feed publication and extraction regression tests
        run: node --test scripts/test-publish-npm-feed.mjs scripts/test-readme-install.mjs scripts/test-market-v2.mjs
      # The script itself decides whether anything needs publishing: same
      # feedDigest as the registry's latest version → "nothing to do", exit 0.
      - name: Build and publish the feed package
        run: node scripts/publish-npm-feed.mjs --publish
