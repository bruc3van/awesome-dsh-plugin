name: Publish the feed to npm (mirrored by npmmirror)

# China-reachable distribution: registry.npmmirror.com mirrors
# registry.npmjs.org, and raw.githubusercontent.com is unreliable from inside
# the GFW — so the market feed and packages mapping ship as the
# awesome-dsh-plugin-feed npm package. Consumers fetch
# https://registry.npmmirror.com/awesome-dsh-plugin-feed/latest/files/data/market-catalog.json
#
# Runs after the official subscription publication has completed successfully and
# can be triggered manually. The publish script's feedDigest gate makes this
# idempotent: same data = no-op without burning a version. Publishing uses
# npm Trusted Publishing (OIDC). After the first authenticated local release,
# configure this repository and publish-npm-feed.yml as the package's trusted
# publisher on npmjs.org, allowing direct npm publish.

on:
  workflow_run:
    workflows:
      - 'Refresh the official DSH market index'
      - 'Fill catalog install mappings'
    types:
      - completed
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/packages.json'
      - 'data/featured.json'
      - 'data/approved.json'
      - 'data/curated.json'
      - 'data/catalog-mapping-skips.json'
      - 'scripts/safe-market-catalog.mjs'
      - 'scripts/market-wire.mjs'
      - 'scripts/market-pool.mjs'
      - 'scripts/publish-npm-feed.mjs'
      - 'scripts/validate-market-catalog.mjs'
      - 'scripts/test-safe-market-catalog.mjs'
      - '.github/workflows/publish-npm-feed.yml'

permissions:
  contents: read

# Let an in-flight npm publish finish. The digest gate and E409 retry in the
# publisher handle repeated requests; cancellation cannot undo a registry PUT.
concurrency:
  group: npm-feed-publish
  cancel-in-progress: false

jobs:
  publish:
    permissions:
      contents: read
      id-token: write
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    # The regression suite runs ~14 mocked npm publishes at ~90 s each (~20 min
    # on hosted runners). The 15-minute cap predates the suite ever completing
    # on CI — it used to crash midway — so it was never exercised until the
    # string-title crash was fixed (2026-11-19).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      - name: Install npm with Trusted Publishing support
        run: npm install --global npm@11.15.0
      - name: Run feed publication and extraction regression tests
        run: node --test scripts/test-publish-npm-feed.mjs scripts/test-readme-install.mjs scripts/test-safe-market-catalog.mjs scripts/test-catalog-mappings.mjs
      # The script itself decides whether anything needs publishing: same
      # feedDigest as the registry's latest version → "nothing to do", exit 0.
      - name: Build and publish the feed package
        run: node scripts/publish-npm-feed.mjs --publish
      - name: Refresh jsDelivr feed aliases
        timeout-minutes: 2
        run: |
          for feed_alias in awesome-dsh-plugin-feed@latest awesome-dsh-plugin-feed; do
            curl --fail --silent --show-error "https://purge.jsdelivr.net/npm/$feed_alias/data/market-catalog.json"
          done
