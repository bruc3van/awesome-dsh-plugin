name: Validate curated data

on:
  pull_request:
    paths:
      - 'data/curated.json'
      - 'data/approved.json'
      - 'data/packages.json'
      - 'data/market-v2.json'
      - 'CATALOG.md'
      - 'catalog/**'
      - 'README.md'
      - 'README_EN.md'
      - 'SHOWCASE.md'
      - 'scripts/**'
      - '.github/workflows/**'
      - 'data/featured.json'
      - 'data/stats.json'
      - 'TOP200.md'

  # Direct code/workflow pushes need the same regression suite as PRs.
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-curated-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Lint all GitHub Actions workflows
        env:
          GOBIN: ${{ runner.temp }}/ci-bin
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$GOBIN/actionlint"
      # Every pipeline test, before anything is merged — main-only workflows
      # used to be the first place market-v2 / extractor / star-anomaly
      # regressions surfaced.
      - name: Run the test suite
        run: >-
          node --test
          scripts/test-check-entry.mjs
          scripts/test-market.mjs
          scripts/test-market-v2.mjs
          scripts/test-publish-npm-feed.mjs
          scripts/test-readme-install.mjs
          scripts/test-render.mjs
          scripts/test-star-anomaly.mjs
      - name: Test the DSH subscription generator
        run: |
          npm ci --ignore-scripts --prefix scripts/host-market
          npm test --prefix scripts/host-market
      - name: Validate data/curated.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/validate-curated.mjs
      # Does the published catalog still agree with this PR's curation data —
      # or did someone edit approved.json / curated.json without re-running
      # scripts/merge.mjs? This compares which repository sits in which volume
      # plus the index links/counts, and which repositories the star boards
      # (TOP200.md, the README Top 50 islands) publish — a board row for a
      # board-excluded / excluded / unapproved repository fails. It compares
      # membership, not bytes: the pages carry star counts and a snapshot date
      # that the daily workflow moves every day, so a byte-level diff would
      # fail every curation PR that stays open across a snapshot refresh
      # instead of reporting real drift.
      - name: Check the published catalog against the curation data
        run: node scripts/merge.mjs --check
      # Smoke tests: both generators must run clean against the stored snapshot.
      # Neither writes anything CI keeps — the review queue and the board are
      # regenerated on main, by the daily workflow and by a review merge.
      - name: Refresh the review queue from the stored snapshot
        run: node scripts/update.mjs --from-snapshot
      - name: Regenerate the leaderboard from the stored snapshot
        run: node scripts/top.mjs
      # The feeds are regenerated from the PR's own curation state so the
      # validators check what main would publish after this PR merges (the
      # committed files are refreshed by refresh-market-v2.yml on push to main).
      - name: Validate the packages mapping
        run: node scripts/validate-packages.mjs
      - name: Rebuild the v2 market feed
        run: node scripts/market-v2.mjs
      - name: Validate the v2 market feed
        run: node scripts/validate-market-v2.mjs
