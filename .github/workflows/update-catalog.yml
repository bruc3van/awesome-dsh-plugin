name: Refresh snapshot, review queue, and market file

on:
  schedule:
    - cron: '17 14 * * *'
  workflow_dispatch:

permissions:
  contents: write

# One group per workflow, never one shared by every workflow that pushes to
# main: GitHub keeps at most one *pending* run per group and a newly queued
# run cancels the pending one, so a shared group silently dropped work (a
# showcase push could cancel a queued market refresh, a curation push the
# daily crawl). Runs of this workflow still queue behind each other.
# Cross-workflow push races are handled by the commit step instead: on a
# rejected push it regenerates on top of the new tip rather than rebasing.
concurrency:
  group: data-update-catalog
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Fetch the topic snapshot and refresh the review queue (including
      # star-growth alerts vs the previous snapshot, written into
      # data/review/pending.* and this job's step summary).
      # CATALOG.md, its catalog/ volumes, and TOP200.md are intentionally NOT
      # regenerated here — they only change via scripts/merge.mjs after the
      # maintainer has reviewed data/review/pending.md and recorded decisions
      # in data/approved.json / data/curated.json. See data/review/README.md.
      # update.mjs aborts without writing anything if the fetched snapshot
      # collapses below 80% of the previous one, so a half-failed crawl keeps
      # yesterday's data instead of publishing a truncated one; a crawl
      # identical to yesterday's is flagged as a warning by update.mjs.
      - name: Refresh snapshot and review queue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update.mjs
      # data/market.json (the downstream dsh-desktop-safe-market feed) IS a pure
      # projection of the snapshot + approval gate + curation, so it is
      # regenerated here and shipped with the same commit, together with
      # MARKET.md (its preview page). Its generator carries the circuit
      # breaker (a collapsed pool aborts the run and keeps yesterday's file).
      - name: Generate the downstream market file
        run: node scripts/market.mjs
      - name: Validate the downstream market file
        run: node scripts/validate-market.mjs
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Today's crawl is the one thing a retry cannot cheaply redo, so it
          # is kept aside; everything else is re-derived on top of the tip.
          crawl="$RUNNER_TEMP/crawl"
          mkdir -p "$crawl"
          cp data/repositories.json data/review/pending.json "$crawl/"
          stage() {
            git add data/repositories.json data/review data/market.json MARKET.md
            if git diff --cached --quiet; then
              echo "Snapshot, review queue and market file are already current — nothing to commit."
              exit 0
            fi
            git commit -m "data: refresh dsh-plugin snapshot, review queue, and market file"
          }
          stage
          # A maintainer push or another data workflow (they no longer share
          # a concurrency group) can land between checkout and here. Rebasing
          # would conflict on the generated files every one of them writes,
          # so instead: move onto the new tip, restore today's crawl, and
          # rebuild the review queue and the market against the tip's
          # approved.json / curated.json. pending.json is restored first so
          # first_seen dates and today's star-growth alerts carry over.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt) — regenerating on top of origin/main."
            git fetch --depth=1 origin main
            git reset --hard FETCH_HEAD
            cp "$crawl/repositories.json" data/repositories.json
            cp "$crawl/pending.json" data/review/pending.json
            node scripts/update.mjs --from-snapshot
            node scripts/market.mjs
            node scripts/validate-market.mjs
            stage
          done
          echo "Push still rejected after 3 attempts."
          exit 1
