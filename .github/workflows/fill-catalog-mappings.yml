name: Fill catalog install mappings

# The single daily install-mapping job. It closes catalog gaps from upstream
# READMEs (catalog-mappings.mjs: the documented `dsh plugin … add` command, an
# npm package that provably belongs to the repository) and then runs one
# subscription-expansion batch (expand-mappings.mjs: stored evidence plus the
# next unmapped approved repositories, identity-checked) — then commits once,
# so refresh-host-market follows exactly once via workflow_run.
#
# Both paths share scripts/mapping-gate.mjs: a repository with fewer than 5
# stars or no push in the 90 days before the snapshot gets no new mapping.
# Existing mappings are never rewritten. Ambiguous catalog cases go to
# data/review/catalog-mapping.md and identity-opaque subscription candidates to
# data/review/subscription/mapping-pending.md, both for the daily AI review.
#
# Runs after the daily snapshot so stars, default branches and pushed_at are
# fresh. The expansion workflow that used to run every three hours is folded
# in here: the eligible pool changes once a day, and fewer bot pushes keep
# main from moving under an in-flight host refresh.

on:
  schedule:
    # 15:40 UTC — after the 14:17 snapshot and its review-queue refresh.
    - cron: '40 15 * * *'
  workflow_dispatch:
    inputs:
      min_stars:
        description: 'Only map repositories at or above this star count (never below the 5-star gate)'
        required: false
        default: '5'

permissions:
  contents: write

concurrency:
  group: data-fill-catalog-mappings
  cancel-in-progress: false

jobs:
  fill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --prefix scripts/host-market
      - name: Run the mapping-rule tests
        run: |
          node --test scripts/test-mapping-gate.mjs scripts/test-catalog-mappings.mjs scripts/test-safe-market-catalog.mjs
          node --import ./scripts/host-market/node_modules/tsx/dist/loader.mjs --test scripts/host-market/expand-mappings.test.mjs
      - name: Map catalog gaps and expand subscription candidates
        env:
          MIN_STARS: ${{ github.event.inputs.min_stars || '5' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          map_all() {
            node scripts/catalog-mappings.mjs --min-stars "$MIN_STARS" --apply --write-report
            node --import ./scripts/host-market/node_modules/tsx/dist/loader.mjs               scripts/host-market/expand-mappings.mjs --fill --size 200 --github-api               --write-pending --label "-$(date -u +%H)b1"
            node scripts/validate-packages.mjs
          }
          map_all
          declare -f map_all > "$RUNNER_TEMP/map_all.sh"
      - name: Commit the new mappings and the review queues
        env:
          MIN_STARS: ${{ github.event.inputs.min_stars || '5' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # shellcheck source=/dev/null
          . "$RUNNER_TEMP/map_all.sh"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          stage() {
            git add data/packages.json data/review/catalog-mapping.md data/review/catalog-mapping.json data/review/subscription
            if git diff --cached --quiet; then
              echo "No mapping changed this run — every confident target was already recorded."
              return 1
            fi
            git commit -m "data: fill catalog and subscription install mappings (>=${MIN_STARS} stars, pushed within 90 days)"
          }
          if ! stage; then exit 0; fi
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then break; fi
            echo "Push rejected (attempt $attempt) — re-mapping on top of origin/main."
            git fetch --depth=1 origin main
            git reset --hard FETCH_HEAD
            map_all
            if ! stage; then exit 0; fi
          done
          echo "Push still rejected after 3 attempts."
          exit 1
