name: Expand subscription mappings

# Keep turning
# already audited eligible sources — and fresh batches of unmapped high-star
# repos — into new packages.json entries. Runs every three hours, three batches
# per run (each batch is its own evidence dir under data/review/subscription/):
# same-day terminal skips (no install evidence, manual-only, legacy declarations,
# templates) are remembered so every batch digs into fresh repositories instead
# of re-probing yesterday's answers. Existing keys are never rewritten.
# Identity-opaque npm packages go to mapping-pending.md for AI review. The cap
# mapping evidence into data/packages.json while the gateway byte budget has
# room; batches self-terminate when nothing new maps.
# refresh-host-market then follows via workflow_run
# (bot pushes do not trigger push).

on:
  schedule:
    - cron: '23 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-expand-subscription-mappings
  cancel-in-progress: false

jobs:
  expand:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --prefix scripts/host-market
      - run: npm test --prefix scripts/host-market
      - name: Skip when the published index already meets the cap
        id: need
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          index = json.loads(Path('data/dsh-market-index.json').read_text())
          count = len(index.get('plugins') or [])
          need = True
          print(f'published_plugins={count} cap=index byte budget (5 MiB gateway)')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write(f'need={str(need).lower()}\ncount={count}\n')
          PY
      - name: Propose and append eligible mappings
        if: steps.need.outputs.need == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Three independent batches; each digs past the previous batches'
          # applies and same-day terminal skips. A label keeps every batch's
          # evidence in its own directory, so a push-retry regeneration can
          # reuse it instead of re-probing. Stop early when a batch maps
          # nothing new — the remaining unmapped pool needs fresh upstream
          # evidence, not another probe today.
          diff_lines() {
            git diff --numstat -- data/packages.json | awk '{s+=$1} END {print s + 0}'
          }
          for batch in 1 2 3; do
            before=$(diff_lines)
            node --import ./scripts/host-market/node_modules/tsx/dist/loader.mjs \
              scripts/host-market/expand-mappings.mjs --fill --size 200 --github-api \
              --write-pending --label "-$(date -u +%H)b${batch}"
            node scripts/validate-packages.mjs
            if [ "$(diff_lines)" = "$before" ]; then
              echo "Batch $batch mapped nothing new; stopping after $batch batch(es)."
              break
            fi
          done
      - name: Commit new mappings and the AI review queue
        if: steps.need.outputs.need == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          stage() {
            git add data/packages.json data/review/subscription
            if git diff --cached --quiet; then
              echo "No new subscription mappings."
              exit 0
            fi
            git commit -m "data: auto-map eligible DSH subscription candidates"
          }
          stage
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then break; fi
            echo "Push rejected (attempt $attempt) — retrying on origin/main."
            git fetch --depth=1 origin main
            git reset --hard FETCH_HEAD
            for batch in 1 2 3; do
              node --import ./scripts/host-market/node_modules/tsx/dist/loader.mjs \
                scripts/host-market/expand-mappings.mjs --fill --size 200 --github-api \
                --write-pending --label "-$(date -u +%H)b${batch}"
              node scripts/validate-packages.mjs
            done
            stage
          done
          echo "Push still rejected after 3 attempts."
          exit 1
